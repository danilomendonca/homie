services:
  postgres:
    image: postgres:18-alpine
    container_name: homie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homie
      POSTGRES_PASSWORD: homie
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - homie-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  homie-pgdata:
